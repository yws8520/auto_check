name: Beyblade Stock Checker

on:
  schedule:
    # Runs every 5 minutes (GitHub's minimum allowed cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual run button in Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_beyblade.py
